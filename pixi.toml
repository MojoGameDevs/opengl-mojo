[workspace]
preview=["pixi-build"]
description = "OpenGL bindings for mojo"
authors = ["Slava Chaunin <67190162+Ssslakter@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[package]
name = "opengl-mojo"
version = "0.1.0"
license-file = "LICENSE"
authors.workspace = true

[package.build.backend]
name="pixi-build-mojo"
version = "0.2.*"

[package.build.config.pkg]
name = "opengl"

[package.host-dependencies]
mojo-compiler = ">=1.1.0.dev2026082605"

[package.build-dependencies]
mojo-compiler = ">=1.1.0.dev2026082605"

[package.run-dependencies]
mojo-compiler = ">=1.1.0.dev2026082605"

[tasks]
fmt = "mojo format -l 1000 src"
gen = "python gen.py"
pkg = "mojo precompile src -o examples/opengl.mojoc"
build = {depends-on = ["gen", "fmt", "pkg"]}
test = "mojo build examples/hello.mojo -o .pixi/hello"
example = "mojo run examples/hello.mojo"

[dependencies]
libopengl = ">=1.7.0,<2"
mojo = ">=1.1.0.dev2026082605"
sdl-mojo = { path = "../sdl-mojo" }

[feature.dev.pypi-dependencies]
ipython = "*"
ipykernel = ">=6.29.5, <7"

[feature.dev.dependencies]
python = ">=3.13.5,<3.14"
llvm-tools = ">=20.1.5,<21"

[environments]
dev = ['dev']
